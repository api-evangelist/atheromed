name: AtheroMed
description: >-
  AtheroMed, Inc. was a privately-held medical device company based in Menlo Park, California,
  founded to treat peripheral artery disease (PAD). Its sole product was the Phoenix Atherectomy
  System, an over-the-wire, low-profile atherectomy catheter that uses a rotating front-cutting
  element at the distal tip to shave diseased material directly into the catheter, where an
  internal Archimedes screw continuously captures and removes the debulked material without
  requiring specialized capital equipment. The Phoenix system received FDA 510(k) clearance in
  January 2014 and CE Mark approval in Europe. AtheroMed was venture-backed by Canaan Partners
  and U.S. Venture Partners, and was acquired by Volcano Corporation in June 2014 for $115
  million upfront plus milestone payments; Volcano was in turn acquired by Royal Philips in
  February 2015. AtheroMed no longer operates as an independent company, its atheromed.com
  domain is parked and listed for sale, and it has no developer program, public API, or
  machine-readable API artifacts of any kind. The Phoenix catheter is now sold as a Philips
  Volcano product.
